version: '3.8'

services:
  # =================================
  # 🐍 BACKEND API
  # =================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: culinary-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=dev_password_123
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=culinary_crafts
      - POSTGRES_USER=culinary_user
      - POSTGRES_PASSWORD=dev_password_123
      - SECRET_KEY=your-secret-key-change-in-production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - culinary-network

  # =================================
  # ⚛️ FRONTEND WEB APP
  # =================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: culinary-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=super-secret-key-change-in-production-12345678901234567890
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - BACKEND_URL=http://culinary-backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - culinary-network

  # =================================
  # 🔴 REDIS CACHE
  # =================================
  redis:
    image: redis:latest
    container_name: culinary-redis
    command: redis-server --requirepass dev_password_123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - culinary-network

  # =================================
  # 🗄️ POSTGRESQL
  # =================================
  postgres:
    image: postgres:15-alpine
    container_name: culinary-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: culinary_crafts
      POSTGRES_USER: culinary_user
      POSTGRES_PASSWORD: dev_password_123
    restart: unless-stopped
    networks:
      - culinary-network

  # =================================
  # 🛠️ PGADMIN 4
  # =================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: culinary-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - culinary-network

networks:
  culinary-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: